<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bug Buster & Automated Tester | IT แม่โจ้ 2570</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Outfit:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- MediaPipe Hands & Camera CDN -->
  <script src="../libs/mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="../libs/mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="logo-group">
      <span class="badge-tag">QUALITY-FIRST DEVELOPER</span>
      <h1 class="game-title">🛡️ Bug Buster & Automated Tester</h1>
    </div>

    <!-- Status & Tracking Indicator -->
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">กำลังเปิดกล้อง AI Hands...</span>
      <button class="mode-toggle-btn" id="toggleControlModeBtn" title="สลับโหมดควบคุมระหว่าง มือ/เมาส์">
        🎮 เมาส์/สัมผัส: เปิดใช้งาน
      </button>
    </div>

    <!-- Actions / Navigation -->
    <div class="header-actions">
      <div class="difficulty-group">
        <button class="diff-btn" data-diff="EASY">🟢 ง่าย</button>
        <button class="diff-btn active" data-diff="MEDIUM">🟡 ปานกลาง</button>
        <button class="diff-btn" data-diff="HARD">🔴 ยาก</button>
      </div>
      <a href="../index.html" class="nav-btn" title="กลับหน้าเลือกรวมเกม">🏠 หน้ารวมเกม</a>
      <a href="../CodeBlock/index.html" class="nav-btn">🧩 Code Block</a>
      <a href="../AIMatch/index.html" class="nav-btn">🤖 AI Match</a>
      <button class="btn btn-restart" id="restartGameBtn">🔄 เริ่มใหม่</button>
    </div>
  </header>

  <!-- Game Main Viewport -->
  <main class="game-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="gameCanvas" width="1100" height="680"></canvas>
  </main>

  <script src="app.js"></script>
</body>
</html>
