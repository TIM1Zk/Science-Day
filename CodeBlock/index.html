<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Block Collector: IT Department Promotion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- MediaPipe CDN Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top App Navigation Header (Cleanly separated from canvas) -->
  <header class="app-header">
    <!-- Status Badge -->
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">กำลังโหลด AI Hands Tracking...</span>
      <button class="btn" id="modeToggleBtn" style="margin-left: 8px; padding: 4px 12px; font-size: 13px;" title="สลับโหมดควบคุม">🖐️ โหมด: กล้อง AI</button>
    </div>

    <!-- Level Selector Bar -->
    <div class="level-selector" id="levelSelector">
      <div class="level-pill active" onclick="switchLevel(0)">🟢 ด่าน 1: ง่าย</div>
      <div class="level-pill" onclick="switchLevel(1)">🟡 ด่าน 2: ปานกลาง</div>
      <div class="level-pill" onclick="switchLevel(2)">🔴 ด่าน 3: ท้าทาย</div>
    </div>

    <!-- Controls -->
    <div class="ui-controls">
      <a href="../Quiz/index.html" class="btn btn-quiz" style="text-decoration: none;" title="ไปเล่นเกมตอบคำถามหลักสูตร">
        📝 เกมตอบคำถามหลักสูตร
      </a>
      <button class="btn btn-shuffle" id="shuffleBtn" title="สุ่มเปลี่ยนโจทย์ / ภารกิจ">
        🎲 สุ่มโจทย์ใหม่
      </button>
      <button class="btn" id="resetBtn" title="รีเซ็ตตำแหน่งบล็อก">
        🔄 รีเซ็ต (Reset)
      </button>
    </div>
  </header>

  <div class="game-container">
    <!-- Hidden Video Source -->
    <video id="webcam" autoplay playsinline></video>

    <!-- Interactive Canvas -->
    <canvas id="gameCanvas" width="1000" height="650"></canvas>
  </div>

  <!-- External Game Logic Script -->
  <script src="app.js"></script>

  <!-- Developer Credits Badge -->
  <div class="dev-credits-badge" style="position: fixed; bottom: 8px; right: 14px; z-index: 9999; background: rgba(5, 8, 17, 0.88); border: 1px solid rgba(0, 240, 255, 0.35); padding: 5px 12px; border-radius: 12px; font-size: 0.72rem; color: #cbd5e1; backdrop-filter: blur(8px); pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,0.5); font-family: 'Kanit', sans-serif;">
    👨‍💻 <strong>ผู้พัฒนา:</strong> 6604106305 กฤตวิทย์ บุญสพ • 6604106322 ฉลองเกียรติ บัวผัน • 6604106340 ณัฐพงษ์ จุไธสง (IT Maejo)
  </div>

</body>
</html>
